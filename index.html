T.push(...[{"id":"enem_mat","ic":"E","n":"ENEM e SAEB: Matemática","cat":"ENEM e SAEB","subj":"mat","d":"Questões no estilo do ENEM e do SAEB: situações do dia a dia, com juros, crescimento, estatística, probabilidade e funções. Cada questão indica a habilidade da BNCC trabalhada.","p":["Leia o enunciado até o fim e anote os dados importantes.","Descubra o que a pergunta pede antes de fazer contas.","Escolha o modelo certo: porcentagem, função, média, probabilidade...","Confira se a resposta faz sentido no contexto da situação."],"e":["Um capital de R$ 100 rende 10% ao mês a juros compostos. Quanto há após 2 meses?","1º mês: 100 · 1,10 = 110. 2º mês: 110 · 1,10 = 121. Resposta: R$ 121."],"t":"Em juros compostos, o juro de cada mês incide sobre o montante do mês anterior, e não só sobre o capital inicial.","pos":20},{"id":"enem_lp","ic":"E","n":"ENEM e SAEB: Português","cat":"ENEM e SAEB","subj":"pt","d":"Questões de leitura no estilo do ENEM e do SAEB: inferir o que o texto sugere, achar a ideia central, entender figuras de linguagem e a ligação entre as partes do texto.","p":["Leia o texto todo antes de olhar as alternativas.","Sublinhe a ideia principal e as palavras que indicam relação (mas, por isso, porque).","Elimine as alternativas que dizem algo que o texto não afirma.","Escolha a que melhor resume ou explica o trecho."],"e":["Texto: \"Estudei a noite toda, mas não adiantou.\" O que \"mas\" indica?","Oposição: o esforço não levou ao resultado esperado."],"t":"A resposta certa precisa estar apoiada no texto. Cuidado com alternativas que parecem lógicas, mas dizem mais do que o texto diz.","pos":21}]);
const T13=[{"id":"bio_cel","ic":"◎","n":"Citologia: a célula","cat":"Célula e genética","subj":"bio","d":"A célula é a menor unidade viva. Conhecer suas partes ajuda a entender como os seres vivos funcionam.","p":["Células procariontes não têm núcleo organizado (bactérias); eucariontes têm núcleo envolvido por membrana (animais, plantas, fungos e protozoários).","A membrana plasmática controla o que entra e sai da célula.","Mitocôndrias fazem a respiração celular e liberam energia; cloroplastos, presentes nas plantas, fazem a fotossíntese.","Ribossomos produzem proteínas; o núcleo guarda o DNA, que comanda as atividades da célula."],"e":["Por que uma célula vegetal tem cloroplasto e a animal não?","Porque as plantas produzem o próprio alimento pela fotossíntese, que acontece nos cloroplastos. Os animais obtêm alimento comendo outros seres."],"t":"Parede celular de celulose e um grande vacúolo também são marcas da célula vegetal.","pos":22},{"id":"bio_gen","ic":"DNA","n":"Genética: leis de Mendel","cat":"Célula e genética","subj":"bio","d":"A genética estuda como as características passam de pais para filhos. Mendel descobriu as primeiras regras estudando ervilhas.","p":["Cada característica é determinada por um par de genes (alelos): um vem do pai e outro da mãe.","O alelo dominante (letra maiúscula, A) se manifesta mesmo em dose única; o recessivo (a) só aparece em dose dupla (aa).","Homozigoto tem alelos iguais (AA ou aa); heterozigoto tem alelos diferentes (Aa).","Use o quadro de Punnett: cruze os gametas de cada genitor para achar as proporções dos filhos."],"e":["Qual a proporção esperada de filhos aa no cruzamento Aa × Aa?","O quadro dá AA, Aa, Aa e aa: 1 em 4, ou seja, 25%."],"t":"Genótipo é a constituição genética (Aa); fenótipo é a característica que aparece (cor, forma).","pos":23},{"id":"bio_eco","ic":"Eco","n":"Ecologia","cat":"Ecologia e ambiente","subj":"bio","d":"A ecologia estuda as relações dos seres vivos entre si e com o ambiente: cadeias alimentares, populações e ciclos da natureza.","p":["Produtores (plantas, algas) fazem fotossíntese; consumidores se alimentam de outros seres; decompositores (fungos e bactérias) reciclam a matéria.","Cadeia alimentar mostra quem come quem; teia alimentar junta várias cadeias.","A energia disponível diminui a cada nível da cadeia, por isso há menos predadores no topo.","Relações ecológicas podem ser harmônicas (mutualismo, comensalismo) ou desarmônicas (predação, parasitismo, competição)."],"e":["Em capim → gafanhoto → sapo → cobra, quem é o consumidor secundário?","O sapo: ele come o gafanhoto, que é o consumidor primário."],"t":"Bioma é uma grande área com clima e vegetação parecidos. No Piauí há Caatinga, Cerrado e áreas de transição.","pos":24},{"id":"fis_cin","ic":"v","n":"Cinemática: velocidade e aceleração","cat":"Mecânica","subj":"fis","d":"A cinemática descreve o movimento: quanto um corpo anda, em quanto tempo e como sua velocidade muda.","p":["Velocidade média = distância percorrida ÷ tempo gasto (v = Δs ÷ Δt).","Para passar de km/h para m/s, divida por 3,6; de m/s para km/h, multiplique por 3,6.","Aceleração média = variação da velocidade ÷ tempo (a = Δv ÷ Δt), medida em m/s².","No movimento uniforme a velocidade é constante; no uniformemente variado, a aceleração é constante."],"e":["Um ônibus percorre 180 km em 3 h. Qual a velocidade média?","v = 180 ÷ 3 = 60 km/h."],"t":"Confira as unidades antes de calcular: não misture km com m nem horas com segundos.","pos":25},{"id":"fis_new","ic":"F","n":"Leis de Newton","cat":"Mecânica","subj":"fis","d":"As três leis de Newton explicam por que os corpos se movem, param ou mudam de direção.","p":["1ª lei (inércia): sem força resultante, um corpo parado continua parado e um corpo em movimento segue em linha reta com a mesma velocidade.","2ª lei: força resultante = massa × aceleração (F = m · a), com força em newtons (N), massa em kg e aceleração em m/s².","3ª lei (ação e reação): quando um corpo empurra outro, recebe de volta uma força de mesma intensidade e sentido oposto.","Peso é a força da gravidade: P = m · g, com g ≈ 10 m/s² na Terra."],"e":["Qual força acelera 2 m/s² um carrinho de 50 kg?","F = m · a = 50 × 2 = 100 N."],"t":"Ação e reação agem em corpos diferentes, por isso não se anulam.","pos":26},{"id":"fis_ene","ic":"E","n":"Energia mecânica","cat":"Energia","subj":"fis","d":"Energia é a capacidade de realizar trabalho. Ela muda de forma, mas a quantidade total se conserva.","p":["Energia cinética, do movimento: Ec = m · v² ÷ 2.","Energia potencial gravitacional, da altura: Ep = m · g · h.","Sem atrito, a energia mecânica (Ec + Ep) se conserva: o que se perde de uma forma se ganha na outra.","Potência é energia por tempo: P = E ÷ t, medida em watts (W)."],"e":["Qual a energia cinética de uma bola de 2 kg a 3 m/s?","Ec = 2 × 3² ÷ 2 = 2 × 9 ÷ 2 = 9 J."],"t":"Se a velocidade dobra, a energia cinética fica quatro vezes maior, porque a velocidade está ao quadrado.","pos":27},{"id":"qui_atom","ic":"Z","n":"Átomo e tabela periódica","cat":"Matéria e átomo","subj":"qui","d":"Toda matéria é formada por átomos. Saber suas partículas e ler a tabela periódica é a base da Química.","p":["O átomo tem um núcleo com prótons (carga +) e nêutrons (sem carga); os elétrons (carga −) ficam na eletrosfera.","Número atômico (Z) = número de prótons; ele identifica o elemento.","Número de massa (A) = prótons + nêutrons; logo, nêutrons = A − Z.","Na tabela periódica, as linhas são os períodos e as colunas são as famílias ou grupos, que reúnem elementos com propriedades parecidas."],"e":["Quantos nêutrons tem o sódio, com Z = 11 e A = 23?","n = A − Z = 23 − 11 = 12 nêutrons."],"t":"Átomo neutro tem o mesmo número de prótons e de elétrons.","pos":28},{"id":"qui_lig","ic":"Na⁺","n":"Ligações químicas","cat":"Matéria e átomo","subj":"qui","d":"Os átomos se unem para ficar mais estáveis. O tipo de ligação explica propriedades como dissolver em água ou conduzir eletricidade.","p":["Regra do octeto: muitos átomos ficam estáveis com 8 elétrons na última camada.","Ligação iônica: um metal doa elétrons a um ametal, formando íons que se atraem. Ex.: NaCl, o sal de cozinha.","Ligação covalente: ametais compartilham pares de elétrons. Ex.: H₂O e CO₂.","Ligação metálica: elétrons livres circulam entre os átomos do metal, o que explica a boa condução de eletricidade."],"e":["Que ligação existe no sal de cozinha (NaCl)?","Iônica: o sódio (metal) perde um elétron para o cloro (ametal), formando Na⁺ e Cl⁻."],"t":"Compostos iônicos dissolvidos em água conduzem corrente elétrica, porque os íons ficam livres.","pos":29},{"id":"qui_rea","ic":"→","n":"Reações químicas e balanceamento","cat":"Reações químicas","subj":"qui","d":"Numa reação química, as substâncias se transformam em outras. Os átomos não somem nem aparecem: só se reorganizam.","p":["Reagentes ficam à esquerda da seta; produtos, à direita.","Lei de Lavoisier: em sistema fechado, a massa total dos reagentes é igual à dos produtos.","Balancear é ajustar os coeficientes para que cada elemento tenha o mesmo número de átomos dos dois lados.","Sinais de reação: mudança de cor, liberação de gás, formação de sólido, liberação ou absorção de calor."],"e":["Como balancear H₂ + O₂ → H₂O?","2 H₂ + O₂ → 2 H₂O: ficam 4 hidrogênios e 2 oxigênios de cada lado."],"t":"Comece pelo elemento que aparece em menos substâncias e deixe hidrogênio e oxigênio para o fim.","pos":30},{"id":"his_col","ic":"1500","n":"Brasil Colônia","cat":"História do Brasil","subj":"his","d":"De 1500 a 1822, o Brasil foi colônia de Portugal, com a economia voltada para exportar produtos à metrópole.","p":["Os portugueses chegaram em 1500; antes disso, milhões de indígenas já viviam no território.","A economia passou por ciclos: pau-brasil, açúcar no Nordeste (com trabalho de africanos escravizados) e ouro em Minas Gerais no século XVIII.","Pelo pacto colonial, a colônia só podia comerciar com Portugal.","Houve resistência: quilombos, como Palmares, e revoltas, como a Inconfidência Mineira (1789)."],"e":["Por que o Nordeste foi o centro da economia no início da colonização?","Por causa da produção de açúcar nos engenhos, favorecida pelo clima e pelo solo de massapê."],"t":"No Piauí, a ocupação colonial se deu sobretudo pela criação de gado, que avançou pelo interior a partir do século XVII.","pos":31},{"id":"his_rep","ic":"1889","n":"Brasil República","cat":"História do Brasil","subj":"his","d":"A República foi proclamada em 1889. Desde então, o país passou por fases democráticas e autoritárias até a Constituição de 1988.","p":["República Velha (1889–1930): poder das oligarquias, política do café com leite e voto aberto.","Era Vargas (1930–1945): leis trabalhistas (CLT, 1943) e a ditadura do Estado Novo (1937–1945).","Ditadura militar (1964–1985): censura, perseguição a opositores e Atos Institucionais, como o AI-5.","Redemocratização: Diretas Já (1984) e a Constituição Cidadã de 1988, que ampliou direitos."],"e":["Por que a Constituição de 1988 é chamada de Cidadã?","Porque ampliou direitos sociais e políticos, como o voto facultativo aos 16 anos e a criação do SUS."],"t":"Monte uma linha do tempo com os períodos: datas e fatos ficam mais fáceis de lembrar.","pos":32},{"id":"his_rev","ic":"1789","n":"Revoluções e mundo contemporâneo","cat":"História geral","subj":"his","d":"As revoluções dos séculos XVIII e XIX mudaram a política, o trabalho e a vida nas cidades em todo o mundo.","p":["Iluminismo: ideias de razão, liberdade e igualdade criticaram o poder absoluto dos reis.","Revolução Francesa (1789): queda da monarquia absolutista e o lema 'Liberdade, Igualdade, Fraternidade'.","Revolução Industrial (Inglaterra, século XVIII): máquinas a vapor, fábricas e crescimento das cidades.","Com as fábricas surgiram a classe operária, as jornadas longas e as primeiras lutas por direitos trabalhistas."],"e":["Qual foi a principal fonte de energia da Primeira Revolução Industrial?","O carvão mineral, usado nas máquinas a vapor."],"t":"Ligue causa e consequência: a fábrica levou gente do campo para a cidade, o que criou novos problemas urbanos.","pos":33},{"id":"gg_cart","ic":"N","n":"Cartografia e coordenadas","cat":"Cartografia","subj":"geog","d":"Mapas representam o espaço em tamanho reduzido. Saber ler escala, legenda e coordenadas ajuda a se localizar.","p":["A escala mostra quantas vezes o real foi reduzido: em 1:100.000, 1 cm no mapa vale 100.000 cm (1 km) no terreno.","Latitude é a distância até a Linha do Equador (norte ou sul); longitude, até o Meridiano de Greenwich (leste ou oeste).","Pontos cardeais: Norte, Sul, Leste e Oeste; colaterais: Nordeste, Noroeste, Sudeste e Sudoeste.","Fusos horários: a cada 15° de longitude a hora muda 1 hora; a leste é mais tarde."],"e":["Em um mapa de escala 1:50.000, 4 cm valem quantos km?","4 × 50.000 = 200.000 cm = 2 km."],"t":"Quanto menor o número depois dos dois-pontos, maior a escala e mais detalhes o mapa mostra.","pos":34},{"id":"gg_clima","ic":"☀","n":"Clima e biomas do Brasil","cat":"Natureza e ambiente","subj":"geog","d":"O clima e a vegetação variam muito no Brasil. Entender os biomas ajuda a valorizar e proteger o ambiente.","p":["Tempo é a condição do momento (hoje está chovendo); clima é o padrão observado ao longo de muitos anos.","Biomas brasileiros: Amazônia, Cerrado, Caatinga, Mata Atlântica, Pantanal e Pampa.","A Caatinga, típica do semiárido nordestino, tem chuvas irregulares e plantas adaptadas à seca, como o mandacaru.","Queimadas e desmatamento ameaçam os biomas; o Cerrado é chamado de berço das águas por abrigar nascentes de grandes rios."],"e":["Qual bioma existe apenas no Brasil?","A Caatinga, que é exclusivamente brasileira."],"t":"Clima semiárido não significa ausência de chuva: chove pouco e de forma irregular.","pos":35},{"id":"gg_pop","ic":"hab","n":"População e urbanização","cat":"Sociedade e espaço","subj":"geog","d":"A Geografia estuda como a população se distribui, cresce e se desloca, e como as cidades se formam.","p":["População absoluta é o total de habitantes; densidade demográfica é o número de habitantes por km².","Êxodo rural é a saída de pessoas do campo para a cidade; foi intenso no Brasil a partir dos anos 1950.","Urbanização acelerada e sem planejamento gera problemas como moradias precárias, trânsito e falta de saneamento.","Migração é o deslocamento de pessoas; pode ser interna (dentro do país) ou internacional."],"e":["Uma cidade tem 200.000 habitantes e 100 km². Qual a densidade demográfica?","200.000 ÷ 100 = 2.000 habitantes por km²."],"t":"Populoso é ter muitos habitantes; povoado é ter alta densidade. O Brasil é populoso, mas pouco povoado.","pos":36},{"id":"soc_cla","ic":"Soc","n":"Clássicos da Sociologia","cat":"Teoria social","subj":"soc","d":"Durkheim, Weber e Marx criaram formas diferentes de explicar a sociedade, que ainda ajudam a entender o mundo atual.","p":["Émile Durkheim: fato social é o modo de agir, pensar e sentir exterior ao indivíduo, que se impõe a ele e é geral na sociedade.","Max Weber: ação social é a ação com sentido para quem a pratica, orientada pelo comportamento dos outros.","Karl Marx: a sociedade é marcada pela luta de classes entre quem possui os meios de produção (burguesia) e quem vende sua força de trabalho (proletariado).","A Sociologia nasceu no século XIX, em meio às mudanças trazidas pela Revolução Industrial."],"e":["A obrigação de usar uniforme na escola é um exemplo de quê, para Durkheim?","De fato social: é exterior ao aluno, coercitivo e geral."],"t":"Associe cada autor a uma palavra-chave: Durkheim, fato social; Weber, ação social; Marx, luta de classes.","pos":37},{"id":"soc_cul","ic":"Cul","n":"Cultura e identidade","cat":"Cultura e sociedade","subj":"soc","d":"Cultura é tudo o que os seres humanos criam e aprendem em sociedade: língua, crenças, costumes, arte e técnicas.","p":["Cultura é aprendida, não herdada biologicamente; ela é transmitida pela convivência.","Etnocentrismo é julgar outras culturas tomando a sua como a correta ou superior.","Relativismo cultural é tentar compreender cada cultura a partir dos seus próprios valores.","Diversidade cultural: o Brasil foi formado por povos indígenas, africanos, europeus e asiáticos, entre outros."],"e":["Dizer que a comida de outro povo é 'estranha e errada' é um exemplo de quê?","De etnocentrismo: usar a própria cultura como medida para julgar a dos outros."],"t":"Indústria cultural é a produção de cultura em larga escala para o consumo, como filmes, músicas e séries de sucesso.","pos":38},{"id":"soc_cid","ic":"§","n":"Cidadania e direitos","cat":"Política e cidadania","subj":"soc","d":"Cidadania é ter direitos e deveres e participar da vida da sociedade. Ela foi conquistada aos poucos, com muita luta.","p":["Direitos civis: liberdade de expressão, de ir e vir, de crença e igualdade perante a lei.","Direitos políticos: votar, ser votado e participar das decisões do país.","Direitos sociais: educação, saúde, trabalho, moradia, previdência e lazer.","Os três poderes: o Legislativo faz as leis, o Executivo administra e o Judiciário julga."],"e":["O direito ao voto é civil, político ou social?","Político: ele garante a participação nas decisões do Estado."],"t":"No Brasil, o voto é obrigatório dos 18 aos 70 anos e facultativo aos 16 e 17 anos, para analfabetos e para quem tem mais de 70.","pos":39},{"id":"fil_ant","ic":"Φ","n":"Filosofia antiga","cat":"História da filosofia","subj":"fil","d":"A filosofia nasceu na Grécia Antiga, quando pensadores passaram a buscar explicações racionais para o mundo, além dos mitos.","p":["Os pré-socráticos procuraram a arché, o princípio de todas as coisas: para Tales de Mileto, era a água.","Sócrates usava perguntas para levar as pessoas a reconhecer o que não sabiam: 'Só sei que nada sei'.","Platão separou o mundo sensível (das aparências) do mundo das ideias (o verdadeiro); o Mito da Caverna ilustra essa diferença.","Aristóteles valorizou a observação e a lógica e definiu a virtude como o meio-termo entre dois excessos."],"e":["O que representam as sombras no Mito da Caverna?","As aparências do mundo sensível, que as pessoas confundem com a realidade verdadeira."],"t":"Filosofia vem do grego e significa 'amor à sabedoria'.","pos":40},{"id":"fil_eti","ic":"?","n":"Ética e moral","cat":"Ética e política","subj":"fil","d":"A ética reflete sobre o que é certo e errado e sobre como devemos agir. Ela ajuda a pensar antes de julgar.","p":["Moral é o conjunto de regras e valores de um grupo; ética é a reflexão filosófica sobre essas regras.","Kant: aja de modo que a regra da sua ação possa valer para todos (imperativo categórico).","Utilitarismo (Bentham e Mill): a ação correta é a que produz a maior felicidade para o maior número de pessoas.","Liberdade e responsabilidade andam juntas: quem escolhe responde pelas consequências."],"e":["Mentir para sair de uma situação difícil seria aceito por Kant?","Não: se todos mentissem, ninguém confiaria em ninguém. A regra não pode valer para todos."],"t":"Em debates, apresente argumentos, não só opiniões: diga por que algo é certo ou errado.","pos":41},{"id":"fil_con","ic":"∴","n":"Teoria do conhecimento","cat":"Teoria do conhecimento","subj":"fil","d":"Como sabemos o que sabemos? Racionalistas e empiristas deram respostas diferentes a essa pergunta.","p":["Racionalismo (Descartes): a razão é a principal fonte do conhecimento verdadeiro.","Descartes usou a dúvida metódica e chegou a uma certeza: 'Penso, logo existo'.","Empirismo (Locke e Hume): todo conhecimento começa pela experiência dos sentidos; a mente nasce como uma folha em branco (tábula rasa).","Kant tentou unir as duas visões: o conhecimento começa pela experiência, mas a razão o organiza."],"e":["Um empirista concordaria que já nascemos sabendo o que é justiça?","Não: para o empirista, as ideias vêm da experiência; a mente começa vazia, como uma tábula rasa."],"t":"O método científico junta as duas coisas: observação (experiência) e raciocínio (razão).","pos":42},{"id":"art_ele","ic":"◐","n":"Linguagem visual e cores","cat":"Artes visuais","subj":"art","d":"Ponto, linha, forma, cor e textura são os elementos que os artistas combinam para criar imagens.","p":["Ponto e linha são os elementos mais simples; a linha pode sugerir movimento e direção.","No ensino tradicional de artes, as cores primárias de pigmento são vermelho, amarelo e azul; misturadas duas a duas, formam as secundárias: laranja, verde e roxo.","Cores quentes (vermelho, laranja, amarelo) passam energia; cores frias (azul, verde, violeta) passam calma.","Cores complementares ficam opostas no círculo cromático e criam contraste forte, como azul e laranja."],"e":["Que cor resulta da mistura de azul e amarelo?","Verde, uma cor secundária."],"t":"Na luz das telas, as cores primárias são outras: vermelho, verde e azul (RGB).","pos":43},{"id":"art_mov","ic":"1922","n":"Movimentos artísticos","cat":"História da arte","subj":"art","d":"Cada época teve estilos próprios. Conhecer os movimentos ajuda a entender o que os artistas queriam expressar.","p":["Renascimento (séculos XV e XVI): perspectiva, proporção e valorização do ser humano; Leonardo da Vinci e Michelangelo.","Barroco (séculos XVII e XVIII): dramaticidade, contraste de luz e sombra e muitos detalhes; no Brasil, Aleijadinho.","Impressionismo (século XIX): pinceladas soltas e estudo da luz ao ar livre; Claude Monet.","Modernismo brasileiro: a Semana de Arte Moderna de 1922 propôs uma arte com identidade nacional; Tarsila do Amaral e Anita Malfatti."],"e":["Qual movimento aparece nas igrejas de Ouro Preto, com esculturas de Aleijadinho?","O Barroco mineiro."],"t":"Abaporu, de Tarsila do Amaral (1928), é um símbolo do movimento antropofágico.","pos":44},{"id":"art_bra","ic":"Art","n":"Arte e cultura brasileira","cat":"Cultura popular","subj":"art","d":"A arte brasileira mistura heranças indígenas, africanas e europeias e está presente nas festas, na música e no artesanato.","p":["A arte rupestre do Parque Nacional Serra da Capivara, no Piauí, tem pinturas milenares e é Patrimônio Mundial da UNESCO.","Literatura de cordel: poemas populares impressos em folhetos, muitas vezes com capas em xilogravura.","Danças e festas populares: frevo, maracatu, bumba-meu-boi, reisado e capoeira, entre outras.","Artesanato regional: cerâmica, renda, palha e madeira; em Teresina, destaca-se o Polo Cerâmico do Poti Velho."],"e":["O que é xilogravura?","Uma técnica de gravura em que o desenho é entalhado na madeira e depois impresso no papel, comum nas capas de cordel."],"t":"O frevo, a roda de capoeira e o samba de roda do Recôncavo Baiano são reconhecidos pela UNESCO como patrimônio cultural imaterial da humanidade.","pos":45},{"id":"ing_pres","ic":"-s","n":"Simple present","cat":"Verbos e tempos","subj":"ing","d":"O simple present fala de rotinas, hábitos e verdades gerais: I study every day.","p":["Use para hábitos e fatos: She works at a school. Water boils at 100 °C.","Com he, she e it, acrescente -s ao verbo (he plays, she reads); verbos terminados em -o, -ch, -sh, -ss e -x recebem -es (goes, watches).","Negativa com don't (I, you, we, they) e doesn't (he, she, it), com o verbo sem -s: She doesn't like coffee.","Pergunta com do ou does no início: Do you speak English? Does he live here?"],"e":["Como fica 'He ___ (go) to school by bus'?","He goes to school by bus: go termina em -o e recebe -es."],"t":"Advérbios de frequência como always, usually, often e never aparecem muito com o simple present.","pos":46},{"id":"ing_past","ic":"-ed","n":"Simple past","cat":"Verbos e tempos","subj":"ing","d":"O simple past fala de ações que começaram e terminaram no passado: I visited my grandmother yesterday.","p":["Verbos regulares recebem -ed: play → played, work → worked.","Verbos irregulares têm forma própria e precisam ser memorizados: go → went, eat → ate, see → saw.","Negativa e pergunta usam did ou didn't, com o verbo na forma base: I didn't go. Did you go?","Marcadores de tempo comuns: yesterday, last week, ago, in 2010."],"e":["Como fica 'They ___ (go) to the beach last Sunday'?","They went to the beach last Sunday: go é irregular."],"t":"Depois de did ou didn't, o verbo nunca vai para o passado: Did she call? (e não Did she called?).","pos":47},{"id":"ing_read","ic":"EN","n":"Leitura em inglês","cat":"Leitura em inglês","subj":"ing","d":"Dá para entender muito de um texto em inglês com estratégias de leitura, mesmo sem conhecer todas as palavras.","p":["Skimming: leia rapidamente o título, as imagens e as primeiras linhas para captar a ideia geral.","Scanning: procure uma informação específica, como um número, um nome ou uma data.","Cognatos são palavras parecidas com o português e de mesmo sentido: important, family, hospital.","Cuidado com os falsos cognatos: pretend (fingir), push (empurrar), library (biblioteca)."],"e":["O que significa 'actually'?","Na verdade, de fato. É um falso cognato: 'atualmente' em inglês é currently."],"t":"Use o contexto: as palavras ao redor ajudam a descobrir o sentido de uma palavra nova.","pos":48},{"id":"esp_art","ic":"el","n":"Artigos e pronomes","cat":"Gramática do espanhol","subj":"esp","d":"Artigos e pronomes em espanhol se parecem com os do português, mas têm diferenças importantes.","p":["Artigos definidos: el, la, los, las. O artigo neutro lo acompanha adjetivos: lo bueno (o que é bom).","Contrações obrigatórias: a + el = al; de + el = del (voy al cine, vengo del parque).","Pronomes pessoais: yo, tú, él, ella, usted, nosotros, vosotros, ellos, ellas, ustedes.","Usted e ustedes são formas de tratamento formais e usam o verbo na terceira pessoa."],"e":["Como se diz 'Eu vou ao mercado'?","Voy al mercado: a + el vira al."],"t":"Alguns substantivos mudam de gênero em relação ao português: el viaje, el puente, la leche, la nariz.","pos":49},{"id":"esp_pres","ic":"-ar","n":"Presente do indicativo","cat":"Gramática do espanhol","subj":"esp","d":"O presente do indicativo expressa ações habituais e fatos atuais: Yo estudio por la mañana.","p":["Verbos em -ar (hablar): hablo, hablas, habla, hablamos, habláis, hablan.","Verbos em -er (comer): como, comes, come, comemos, coméis, comen.","Verbos em -ir (vivir): vivo, vives, vive, vivimos, vivís, viven.","Alguns verbos mudam a vogal do radical: querer → quiero; poder → puedo; pedir → pido."],"e":["Como se conjuga 'tener' com yo?","Yo tengo, porque tener é irregular."],"t":"Para dizer a idade, usa-se tener: Tengo 16 años (e não 'soy 16 años').","pos":50},{"id":"esp_het","ic":"¡!","n":"Falsos amigos","cat":"Vocabulário e leitura","subj":"esp","d":"Algumas palavras em espanhol parecem português, mas têm outro sentido. São os falsos amigos (heterossemânticos).","p":["Exquisito significa delicioso, e não esquisito.","Embarazada significa grávida, e não embaraçada.","Oficina é escritório; a oficina mecânica é taller.","Rato significa momento, instante; o animal rato é ratón."],"e":["O que significa 'La comida está exquisita'?","Que a comida está deliciosa."],"t":"Na dúvida, leia a frase inteira: o contexto quase sempre mostra o sentido certo.","pos":51},{"id":"edf_saude","ic":"♥","n":"Atividade física e saúde","cat":"Corpo e saúde","subj":"edf","d":"Praticar atividade física com regularidade melhora o coração, os músculos, o sono e o humor.","p":["A Organização Mundial da Saúde (OMS) recomenda que crianças e adolescentes façam, em média, 60 minutos por dia de atividade física moderada a vigorosa.","Exercício aeróbico (caminhada, corrida leve, bicicleta) é contínuo e trabalha coração e pulmões; o anaeróbico (tiros curtos, musculação) é intenso e de curta duração.","Aqueça antes da atividade, beba água durante e faça uma volta à calma no final.","Frequência cardíaca é o número de batimentos por minuto; ela sobe com o esforço e volta ao normal no repouso."],"e":["Uma corrida leve de 30 minutos é aeróbica ou anaeróbica?","Aeróbica: é contínua, de intensidade moderada e usa o oxigênio como principal fonte de energia."],"t":"O sedentarismo aumenta o risco de doenças como diabetes tipo 2, hipertensão e obesidade.","pos":52},{"id":"edf_esp","ic":"◉","n":"Esportes coletivos","cat":"Esportes","subj":"edf","d":"Futsal, vôlei, basquete e handebol têm regras próprias, mas todos dependem de cooperação e respeito.","p":["Vôlei: 6 jogadores de cada lado; os sets vão até 25 pontos (o 5º até 15), com 2 pontos de diferença.","Futsal: 5 jogadores por equipe, incluindo o goleiro; dois tempos de 20 minutos cronometrados.","Basquete: 5 jogadores por equipe; a cesta vale 2 pontos, ou 3 se arremessada de fora da linha de três, e o lance livre vale 1.","Handebol: 7 jogadores por equipe (6 de linha e 1 goleiro); a bola é jogada com as mãos."],"e":["Quantos pontos vale uma cesta de basquete arremessada de fora da linha de três?","3 pontos."],"t":"Fair play é jogar limpo: respeitar regras, adversários e arbitragem.","pos":53},{"id":"edf_prat","ic":"♪","n":"Lutas, danças e ginástica","cat":"Práticas corporais","subj":"edf","d":"Além dos esportes, a Educação Física estuda lutas, danças, ginásticas e brincadeiras, que fazem parte da cultura corporal.","p":["Lutas têm regras e respeito ao oponente, como judô, capoeira e caratê; luta não se confunde com briga.","Danças expressam a cultura de um povo: forró, frevo, quadrilha junina, samba.","A ginástica pode ser de condicionamento, de demonstração ou competitiva, como a artística e a rítmica.","Brincadeiras e jogos populares, como queimada e pique-esconde, também são práticas corporais."],"e":["Qual a diferença entre luta e briga?","A luta tem regras, objetivos e respeito ao oponente; a briga é uma agressão sem regras."],"t":"A BNCC organiza a Educação Física em brincadeiras e jogos, esportes, ginásticas, danças, lutas e práticas corporais de aventura.","pos":54}],T13I=new Set(T13.map(t=>t.id));T.push(...JSON.parse(JSON.stringify(T13)));

function qchP(d){return d.split(';').map(s=>{const i=s.lastIndexOf('=');return i<1?null:[s.slice(0,i).trim().slice(0,14),parseFloat(s.slice(i+1).replace(',','.'))]}).filter(p=>p&&p[0]&&isFinite(p[1])).slice(0,12)}

y=v=>T+(H-T-B)*(1-(v-bot)/((top-bot)||1)),n=P.length,cw=(W-L-R)/n,cx=i=>L+cw*(i+.5),fm=v=>String(Math.round(v*100)/100).replace('.',',');

g+=`<line class=qax x1=${L} x2=${L} y1=${T} y2=${H-B} /><line class=qax x1=${L} x2=${W-R} y1=${y(0).toFixed(1)} y2=${y(0).toFixed(1)} />`;
if(k=='barras')P.forEach((p,i)=>{const y0=y(0),y1=y(p[1]),bw=Math.min(46,cw*.62);g+=`<rect class=qbr x=${(cx(i)-bw/2).toFixed(1)} y=${Math.min(y0,y1).toFixed(1)} width=${bw.toFixed(1)} height=${Math.max(1,Math.abs(y0-y1)).toFixed(1)} rx=3 /><text class=qvl x=${cx(i).toFixed(1)} y=${(Math.min(y0,y1)-5).toFixed(1)} text-anchor=middle>${fm(p[1])}</text>`});

function qtx(s){s=String(s==null?'':s);let o='',i=0,m;QCRE.lastIndex=0;while((m=QCRE.exec(s))){o+=esc(s.slice(i,m.index))+(qch(m[1],m[2]||'',m[3])||esc(m[0]));i=QCRE.lastIndex}return o+esc(s.slice(i))}

function hrsNorm(h){const o=JSON.parse(JSON.stringify(HRDEF));if(h&&typeof h=='object'){if(Array.isArray(h.dias)&&h.dias.length)o.dias=h.dias.map(Number).filter(d=>d>=0&&d<=6);HRTK.forEach(k=>{if(h[k]&&typeof h[k]=='object')Object.assign(o[k],h[k])})}return o}

function hrsClean(h){const p=t=>({on:!!t.on,ini:t.ini,fim:t.fim,aula:+t.aula||50,rapos:+t.rapos||0,rmin:+t.rmin||0});return{v:1,dias:wkSort(h.dias),m:p(h.m),t:p(h.t),n:p(h.n)}}
function hrsSig(h){return HRTK.filter(k=>h[k].on).map(k=>[k,h[k].ini,h[k].fim,+h[k].aula,+h[k].rapos||0,+h[k].rmin||0].join('/')).join('|')}
function hrsSlots(h){const L=[];let k=0;HRTK.forEach(tk=>{const t=h[tk];if(!t||!t.on)return;const f=hm(t.fim),a=+t.aula||50;let c=hm(t.ini),i=0;if(!(c<f))return;
while(c+a<=f){L.push({k,n:k+1,tk,i:++i,a:c,b:c+a});k++;c+=a;const r=+t.rmin||0;if(r>0&&i==+t.rapos&&c+r+a<=f){L.push({rec:1,tk,a:c,b:c+r});c+=r}}L.push({end:1,tk,a:c,b:f,left:f-c})});return L}

function hrsErr(h){const E=[],on=HRTK.filter(k=>h[k].on);if(!on.length)E.push({lvl:'er',t:'Ligue pelo menos um turno (manhã, tarde ou noite).'});if(!h.dias.length)E.push({lvl:'er',t:'Marque pelo menos um dia de aula.'});

function hrsSum(h){const A=hrsSlots(h).filter(s=>s.k!=null);return HRTK.filter(k=>h[k].on).map(k=>HRTN[k]+' '+h[k].ini+'–'+h[k].fim).join(' · ')+' · '+diasTxt(h.dias)+' · '+A.length+(A.length==1?' aula':' aulas')}

</div>`:''}</div>`}).join('')}
<div class=hrsec id=hrprev><b>Como fica o dia</b>${hrsPrevH()}</div>`}
function hrsPrevH(){const h=HRE,E=hrsErr(h),av=E.filter(e=>e.lvl=='av').map(e=>`<p class=hrav>${esc(e.t)}${e.f?`<button type=button class=hrc onclick="hrSet('${e.k}','aula',${e.f.a})">Encaixar: ${e.f.n} aulas de ${e.f.a} min${e.f.left?' (sobram '+e.f.left+' min)':''}</button>`:''}</p>`).join('');

const on=HRTK.filter(k=>h[k].on),S=hrsSlots(h),A=S.filter(s=>s.k!=null),first=hm(h[on[0]].ini),last=hm(h[on[on.length-1]].fim),tot=Math.max(1,last-first),mins=A.reduce((m,s)=>m+s.b-s.a,0);

async function hrsSave(sid){const e=hrsErr(HRE).find(x=>x.lvl=='er');if(e){pm(e.t,1);return}try{const r=await rq('POST','/rpc/set_school_hours',{b:{p_school:sid,p_hours:hrsClean(HRE)}});const x=SCH.find(y=>y.id==sid);if(x)x.hours=r||hrsClean(HRE);toast('Horário salvo. A chamada e as grades já seguem o novo horário.');hrsBack()}catch(err){pm(err&&err.code=='permission-denied'?'Só o administrador ou a gestão da escola podem mudar o horário.':'Não foi possível salvar o horário. Confira os campos e tente de novo.',1)}}
function hrsNow(h){const d=new Date(),wd=d.getDay(),m=d.getHours()*60+d.getMinutes(),S=hrsSlots(h),A=S.filter(s=>s.k!=null);if(!A.length)return null;if(!h.dias.includes(wd))return{off:1};
